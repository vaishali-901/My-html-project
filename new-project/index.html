<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        div{
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 3px solid rgb(21, 139, 189);
            padding: 20px;
            margin: 50px;
            text-align: center;
        }
        input{
            padding: 10px;
            border-radius: 5px;
            border: 3px solid rgb(165, 191, 238);
            color: rgb(3, 34, 93);
        }
        input::placeholder{
            color: rgb(3, 34, 93);
        }
        input:focus{
            outline: none;
            border: 3px solid rgb(21, 139, 189);
        }
        button{
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgb(165, 191, 238);
            background-color: rgb(165, 191, 238);
            color: rgb(3, 34, 93);
        }
        button:focus{
            outline: none;
            border: 3px solid rgb(21, 139, 189);
            background-color: rgb(67, 169, 227);
        }
       
    </style>
</head>
<body>
    <div>
        <h1>Login</h1>
       <input type="email" placeholder="Email">    
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>
    
</body>
</html>
